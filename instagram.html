<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fafafa; color: #262626; }
        
        /* Navbar */
        header { background: #ffffff; border-bottom: 1px solid #dbdbdb; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; height: 60px; }
        .logo { font-size: 1.5rem; font-weight: bold; font-family: cursive; }
        .nav-search { background: #efefef; border: none; padding: 8px 15px; border-radius: 8px; outline: none; width: 220px; font-size: 0.9rem; }

        /* Feed Layout */
        .main-container { max-width: 470px; margin: 25px auto; padding: 0 10px; }
        
        /* Stories */
        .stories { background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 12px; display: flex; gap: 15px; overflow-x: auto; margin-bottom: 20px; }
        .story { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex-shrink: 0; }
        .story-circle { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); padding: 2px; display: flex; justify-content: center; align-items: center; }
        .story-img { width: 56px; height: 56px; border-radius: 50%; background: #e2e8f0; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; color: #555; }
        .story span { font-size: 0.75rem; margin-top: 5px; color: #262626; }

        /* Post Card */
        .post { background: white; border: 1px solid #dbdbdb; border-radius: 8px; margin-bottom: 20px; }
        .post-header { display: flex; align-items: center; padding: 12px; gap: 10px; font-weight: bold; font-size: 0.9rem; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #cbd5e1; }
        .post-img { width: 100%; height: 350px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: bold; }
        .post-actions { padding: 10px 12px; display: flex; gap: 15px; font-size: 1.4rem; cursor: pointer; }
        .post-footer { padding: 0 12px 12px 12px; font-size: 0.9rem; }
        .likes { font-weight: bold; margin-bottom: 5px; }
        .caption span { font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Instagram</div>
    <input type="text" class="nav-search" placeholder="Search">
</header>

<div class="main-container">
    <!-- Stories Section -->
    <div class="stories">
        <div class="story"><div class="story-circle"><div class="story-img">You</div></div><span>Your story</span></div>
        <div class="story"><div class="story-circle"><div class="story-img">User1</div></div><span>alex_99</span></div>
        <div class="story"><div class="story-circle"><div class="story-img">User2</div></div><span>sarah_c</span></div>
        <div class="story"><div class="story-circle"><div class="story-img">User3</div></div><span>dev_j</span></div>
        <div class="story"><div class="story-circle"><div class="story-img">User4</div></div><span>emma_w</span></div>
    </div>

    <!-- Post 1 -->
    <div class="post">
        <div class="post-header">
            <div class="avatar"></div>
            <span>alex_99</span>
        </div>
        <div class="post-img">Post Image / Content</div>
        <div class="post-actions">
            <span onclick="toggleLike(this)">🤍</span>
            <span>💬</span>
            <span>↗️</span>
        </div>
        <div class="post-footer">
            <div class="likes"><span id="likeCount">1,240</span> likes</div>
            <div class="caption"><span>alex_99</span> Beautiful sunset view today! 🌅</div>
        </div>
    </div>
</div>

<script>
    function toggleLike(element) {
        if (element.textContent === '🤍') {
            element.textContent = '❤️';
            let count = document.getElementById('likeCount');
            count.textContent = parseInt(count.textContent.replace(',', '')) + 1;
        } else {
            element.textContent = '🤍';
            let count = document.getElementById('likeCount');
            count.textContent = parseInt(count.textContent.replace(',', '')) - 1;
        }
    }
</script>

</body>
</html>
