<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 420px; }
        h2 { color: #0f172a; margin-top: 0; margin-bottom: 15px; text-align: center; }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; resize: none; box-sizing: border-box; margin-bottom: 15px; outline: none; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        #analysisResult { margin-top: 15px; background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Resume Analyzer</h2>
    <textarea id="resumeText" placeholder="Paste your resume content or summary here..."></textarea>
    <button onclick="analyzeResume()">Analyze Resume</button>
    <div id="analysisResult"></div>
</div>

<script>
    function analyzeResume() {
        const text = document.getElementById('resumeText').value.trim();
        const resultDiv = document.getElementById('analysisResult');

        if (!text) {
            resultDiv.style.display = 'block';
            resultDiv.style.color = '#dc2626';
            resultDiv.innerHTML = 'Please paste your resume text first.';
            return;
        }

        // Mock AI scoring based on keywords
        let score = 60;
        if (text.toLowerCase().includes('javascript') || text.toLowerCase().includes('python')) score += 15;
        if (text.toLowerCase().includes('project') || text.toLowerCase().includes('experience')) score += 15;
        if (text.toLowerCase().includes('education') || text.toLowerCase().includes('degree')) score += 10;
        if (score > 100) score = 100;

        resultDiv.style.display = 'block';
        resultDiv.style.color = '#0f172a';
        resultDiv.innerHTML = `<strong>Analysis Complete!</strong><br>
                              • Estimated Score: <strong>${score}/100</strong><br>
                              • Recommendation: ${score >= 80 ? 'Strong profile! Good keyword match.' : 'Consider adding more technical skills and project details.'}`;
    }
</script>

</body>
</html>
